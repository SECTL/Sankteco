name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            artifact_name: Sankteco-macOS
          - os: ubuntu-22.04
            artifact_name: Sankteco-Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 打包独立更新器
      - name: Build Updater
        run: |
          cd updater_tool
          pyinstaller updater.spec --noconfirm

      # 打包主程序
      - name: Build Main App
        run: |
          pyinstaller start.spec --noconfirm

      # 把更新器塞进主程序目录
      - name: Merge Updater
        run: |
          # 拷贝 dist 目录下的 SanktecoUpdater (Linux/macOS 无后缀)
          cp updater_tool/dist/SanktecoUpdater dist/Sankteco/

      # 打包成 tar.gz
      - name: Package Artifact
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz Sankteco

      # 上传供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
